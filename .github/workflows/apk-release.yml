name: Move APKs to GitHub Releases

# One-time migration: attaches every APK still tracked in downloads/ to the
# GitHub Release of its existing tag. Removed together with downloads/.
on:
  push:
    branches: [main]
    paths:
      - .github/workflows/apk-release.yml
  workflow_dispatch:

permissions:
  contents: write

jobs:
  attach:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Attach APKs to releases
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          latest=$(node -p 'require("./android-release.json").version')
          for apk in $(ls downloads/nutriciolog-*.apk | sort -V); do
            version=$(basename "$apk" .apk | sed 's/^nutriciolog-//')
            tag="v$version"
            sha256sum "$apk"
            git ls-remote --exit-code --tags origin "refs/tags/$tag" >/dev/null
            if ! gh release view "$tag" >/dev/null 2>&1; then
              gh release create "$tag" --verify-tag --title "$tag" \
                --notes "Android APK $version. SHA-256: $(sha256sum "$apk" | cut -d' ' -f1)" \
                --latest=$([ "$version" = "$latest" ] && echo true || echo false)
            fi
            if ! gh release view "$tag" --json assets -q '.assets[].name' | grep -qx "$(basename "$apk")"; then
              gh release upload "$tag" "$apk"
            fi
          done
          gh release list --limit 10
