name: Deploy to Yandex Object Storage

on:
  push:
    branches:
      - main
  workflow_dispatch:

jobs:
  deploy:
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21

      - name: Validate shared client and Android compilation
        run: |
          npm ci --ignore-scripts --no-audit --no-fund
          npm run test:shared-client
          node --test tests/*.test.mjs
          npm run android:sync
          cd android
          bash gradlew :app:compileDebugJavaWithJavac --no-daemon

      - name: Configure AWS CLI
        run: |
          aws configure set aws_access_key_id "${{ secrets.YC_ACCESS_KEY_ID }}"
          aws configure set aws_secret_access_key "${{ secrets.YC_SECRET_ACCESS_KEY }}"
          aws configure set region ru-central1

      - name: Prepare website
        run: |
          mkdir -p deploy
          cp index.html deploy/
          cp ai-status.json deploy/
          cp android-release.json deploy/
          cp styles.css deploy/
          cp -r js deploy/
          cp firebase-client.js deploy/
          cp privacy.html terms.html deploy/
          cp pwa.js deploy/
          cp service-worker.js deploy/
          cp manifest.webmanifest deploy/
          cp -r icons deploy/
          cp -r downloads deploy/

      - name: Deploy to Yandex Object Storage
        run: |
          aws s3 sync deploy/ s3://nutriciolog-x20/ \
            --endpoint-url=https://storage.yandexcloud.net \
            --delete --exclude "android-release.json"

      - name: Publish fresh Android update metadata
        run: |
          aws s3 cp android-release.json s3://nutriciolog-x20/android-release.json \
            --endpoint-url=https://storage.yandexcloud.net \
            --cache-control="no-store" --content-type="application/json"

      - name: Tag published version
        run: |
          version=$(node -e 'const fs=require("node:fs");console.log(fs.readFileSync("js/core.js","utf8").match(/APP_VERSION = "(v[0-9]+\.[0-9]+\.[0-9]+)"/)[1])')
          git fetch origin "refs/tags/$version:refs/tags/$version" || true
          if ! git rev-parse "refs/tags/$version" >/dev/null 2>&1; then
            git tag "$version" "$GITHUB_SHA"
            git push origin "refs/tags/$version"
          fi
